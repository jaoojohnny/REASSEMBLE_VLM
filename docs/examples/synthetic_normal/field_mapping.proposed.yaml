# 欄位映射「提案」：由 inspect-h5 依 synthetic_normal.h5 自動產生（2026-10-04T17:55:07+08:00）
# 未經使用者核對前不可當正式設定使用。核對後另存為 configs/field_mapping.yaml，
# 並把 status 改成 confirmed（第 2 包 indexer 只接受 confirmed）。
version: 0
status: proposed
source_file: "synthetic_normal.h5"
segments:
  container: "/segments_info"   # 偵測到 4 段
  id: group_name                 # 以子群組名稱當 segment_id
  start: "start"
  end: "end"
  success: "success"   # 推測 True=成功、False=失敗（待確認）
  text: "text"
  time_unit: "s"   # 推測，待確認
  time_base: "same_as"   # 參考 /timestamps/cam_left
  time_reference: "/timestamps/cam_left"
  children:
    - container_pattern: "/segments_info/*/Low_level"   # 第 1 層
action_parse:
  source: text
  regex: '^\s*(?P<action>[A-Za-z][A-Za-z_\-]*)\s*(?P<part>.*?)\s*$'   # 第一個詞當 action（待確認）
  target_action: insert   # 規格：只取一種 Insert 操作
  target_part: null       # 候選：["round peg 1", "square peg 2"]
cameras:
  "cam_left":
    video: "/cam_left"
    encoding: "mp4"
    timestamps: "/timestamps/cam_left"
    frame_to_time: index   # 第 i 幀 ↔ 第 i 個時間戳（影片 90 幀 / 時間 90 筆，待確認）
    role: null              # external / wrist / event，待確認
  "cam_right":
    video: "/cam_right"
    encoding: "mp4"
    timestamps: "/timestamps/cam_right"
    frame_to_time: index   # 第 i 幀 ↔ 第 i 個時間戳（影片 90 幀 / 時間 90 筆，待確認）
    role: null              # external / wrist / event，待確認
  "cam_wrist":
    video: "/cam_wrist"
    encoding: "mp4"
    timestamps: "/timestamps/cam_wrist"
    frame_to_time: index   # 第 i 幀 ↔ 第 i 個時間戳（影片 90 幀 / 時間 90 筆，待確認）
    role: null              # external / wrist / event，待確認
missing_fields:   # 規格輸出需要、但資料中沒有：第 3 包人工標註
  - failure_reason
  - evidence_start_sec
  - evidence_end_sec
  - best_camera
  - visible_evidence
