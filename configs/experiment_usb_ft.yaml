# 第 8 包測試集（2026-10-25 事先登記，在看任何 USB 結果之前寫好）：USB 接頭的插入，全部 70 段當新的測試集。
# 提示詞用 ft-generic（不提任何零件專屬細節；BNC 測試集上和第 1 版提示詞一樣好），只把零件名稱換成 USB connector。
# 影格和 BNC 相同：4 幀 × 3 相機、最後一張在段結束後 0.5 秒、長邊 512。答案只用資料集的成功／失敗標記（USB 沒有人工標準答案）。
# 這份只由 configs/final_test_usb.yaml 使用（測試集凍結後只跑一次）；跑過之後不要再改。
experiment:
  name: final_test_usb_ft
  models: [qwen3vl_8b, claude_sonnet55, gpt61_sol]
  split_dir: data/splits/usb_test100
  include: [test]
  frames_root: data/derived/frames/insert_USB
  sampling_template: uniform_n{n}_sb0.5_eb0.5_jpg
  frames: [4]
  cameras: [hama1, hama2, hand]
  out_dir: experiments
  timeout_sec: 180
  repair_retry: true
  evidence_tolerance_sec: 0.05
  prompt:
    version: ft-generic
    template: configs/prompts/ft_generic.txt
  task:
    part: USB connector
    part_note: ""
    success_definition: the part ends up fully inserted in its place on the board; after the gripper opens and moves away, the part stays there.
    failure_definition: at the end of the images, the part is not correctly and fully inserted (for example beside its place, tilted, not fully in, dropped, or carried away by the gripper), or the board was moved.
    cameras:
      hama1: external camera 1 (fixed, looks at the task board)
      hama2: external camera 2 (fixed, another angle on the task board)
      hand: wrist camera mounted on the gripper (moves with the gripper)
    failure_reasons:   # 提示詞不顯示（只答成敗）；保留是為了和標註設定的類別一致（程式會檢查）
      misalignment: 'connector not aligned with the socket: offset, tilted, or stopped next to it; not coaxial with the socket while pushing or twisting'
      incomplete_insert: 'connector is on the socket (coaxial) but not pushed fully or not twisted to lock: too little rotation, rotated back before release, pulled straight off, or loose after release'
      slip_or_drop: connector slips, rotates or drops in the gripper, including sliding out of the closed gripper
      board_lifted: the board or fixture is lifted, pushed or moved while inserting, twisting or lifting
      wrong_contact: touches the wrong place (board surface, another part, a wrong socket) or collides, never reaching the correct socket
      other: none of the above
      unknown: a failure is visible but the cause cannot be determined from the images
