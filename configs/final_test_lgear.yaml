      kind: cascade
      first: qwen3vl8b_prob_t0999
      second: gpt61_sol_ft_eb05_f4
    - id: hybrid_v3_gpt                     # 次要：第 10 包規則的兩階段（Qwen＋Skill 第三版 → GPT）
