# 第 8 包：新的測試集（USB 接頭插入，70 段、失敗 21），只跑一次。第 6、7 包的 final_test*.yaml 與結果都不動。
# 方法清單在 2026-10-25 寫好：在任何 USB 影格或結果被看到之前；BNC（86 段，改當開發集）只用來確認程式能跑。
# 雙擊 run_final_test_usb.bat：訓練池影格 → 測試段影格 → 每個方法跑一次 → 評分＋執行時間 → experiments/final_test_usb/report.md。
# 第一次執行會把本檔、模型設定、實驗設定、提示詞、做法 A 設定的雜湊寫進 experiments/final_test_usb/lock.json，之後改了就拒絕執行。
