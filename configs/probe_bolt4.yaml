# 第 9 包（2026-10-30 事先登記）：做法 A（小分類器）在 bolt 4 測試集。設定和 probe_usb.yaml／第 6 包 probe_eb1 完全相同
# （DINOv2-base、+1 秒、1 幀），只換目標零件：訓練池＝bolt 4 以外的所有零件（含 BNC、USB），且錄影不在 bolt 4 測試集的錄影裡。
probe:
  name: probe_bolt4_dinov2_eb1
  experiment_name: dev_bolt4_probe   # bolt 4 沒有開發集；這個名稱只是設定需要
  final_experiment_name: final_test_bolt4
  split_dir: data/splits/bolt4_test100
  index_dir: data/index
  action: insert
  target_part: bolt 4
  frames_root: data/derived/frames
  sampling_template: "uniform_n{n}_sb0.5_eb1_jpg"
  end_buffer: 1
  frames: [1]
  cameras: [hama1, hama2, hand]
  out_dir: experiments
  encoder:                        # 凍結，不訓練；每張圖取 CLS＋patch 平均（1536 維）
    hf_id: facebook/dinov2-base
    revision: main
    dtype: float16
    batch_size: 32
    processor_kwargs:             # 不做中央裁切（避免切掉畫面左右兩側）；224x294 維持約 4:3，兩邊都是 14 的倍數
      do_center_crop: false
      size: {height: 224, width: 294}

  classifier:                     # 標準化 → PCA → 邏輯迴歸（失敗、成功等權）
    C_grid: [0.01, 0.1, 1.0]
    pca_grid: [32, 64]
    cv_folds: 5                   # 依錄影分組的交叉驗證（同一支錄影不會同時在訓練和驗證）
    seed: 0
