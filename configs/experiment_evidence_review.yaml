experiment:
  name: dev_evidence_review_v1
  models:
  - qwen3vl_8b_evidence
  split_dir: data/splits/bnc_alldev
  include:
  - dev
  frames_root: data/derived/frames/insert_BNC
  sampling_template: uniform_n{n}_sb0.5_eb0.5_jpg
  frames:
  - 4
  cameras:
  - hama1
  - hama2
  - hand
  out_dir: experiments
  timeout_sec: 240
  repair_retry: false
  evidence_tolerance_sec: 0.05
  prompt:
    version: evidence-review-v1
    template: configs/prompts/ft_generic.txt
  task:
    part: BNC connector
    part_note: ''
    success_definition: the part ends up fully inserted in its place on the board;
      after the gripper opens and moves away, the part stays there.
    failure_definition: at the end of the images, the part is not correctly and fully
      inserted (for example beside its place, tilted, not fully in, dropped, or carried
      away by the gripper), or the board was moved.
    cameras:
      hama1: external camera 1 (fixed, looks at the task board)
      hama2: external camera 2 (fixed, another angle on the task board)
      hand: wrist camera mounted on the gripper (moves with the gripper)
    failure_reasons:
      misalignment: 'connector not aligned with the socket: offset, tilted, or stopped
        next to it; not coaxial with the socket while pushing or twisting'
      incomplete_insert: 'connector is on the socket (coaxial) but not pushed fully
        or not twisted to lock: too little rotation, rotated back before release,
        pulled straight off, or loose after release'
      slip_or_drop: connector slips, rotates or drops in the gripper, including sliding
        out of the closed gripper
      board_lifted: the board or fixture is lifted, pushed or moved while inserting,
        twisting or lifting
      wrong_contact: touches the wrong place (board surface, another part, a wrong
        socket) or collides, never reaching the correct socket
      other: none of the above
      unknown: a failure is visible but the cause cannot be determined from the images
